<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <header>
            <div class="header-left">
                <div class="header-icon">
                    <i class="fas fa-crosshairs"></i>
                </div>
                <div class="header-text">
                    <h1>SONAR STRIKE</h1>
                    <p>Tactical Warfare System</p>
                </div>
            </div>

            <div class="header-right">
                <div class="player-container hidden">
                    <div class="player-icon">
                        <i class="fa-solid fa-person-military-rifle"></i>
                        <p>Commander</p>
                    </div>
                    <p id="player-avatar"></p>
                </div>
                <p class="system">SYSTEM ONLINE</p>
            </div>
        </header>
        <img
            src="./assets/images/background.jpg"
            alt="A large boat floating on top of a body of water"
            id="bg-image"
        />
        <main id="app" class="app"></main>
    </body>
